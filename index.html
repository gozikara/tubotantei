<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ツボ刑事">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>ツボ刑事 — 解剖・経穴バトル</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a1628;
    --card: #111e33;
    --card2: #16233c;
    --border: rgba(74,158,255,0.25);
    --accent: #4a9eff;
    --gold: #ffc832;
    --text: #e8eaf0;
    --muted: #8899aa;
    --correct: #4aff7f;
    --wrong: #ff5a6a;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: radial-gradient(120% 60% at 50% 0%, #12233f 0%, var(--bg) 60%);
  }

  /* ===== Top bar ===== */
  .topbar {
    padding: calc(10px + var(--safe-t)) 16px 10px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .badge {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #1b3a63, #0e1d33);
    border: 2px solid var(--gold); display: grid; place-items: center; font-size: 1.1rem;
  }
  .topbar .who { flex: 1; min-width: 0; }
  .topbar .who .name { font-weight: 900; font-size: 0.95rem; color: var(--gold); }
  .topbar .who .lvl { font-size: 0.72rem; color: var(--muted); }
  .xpbar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .xpbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #7fc4ff); width: 0%; transition: width .5s; }
  .coin { font-size: 0.85rem; font-weight: 900; color: var(--gold); white-space: nowrap; }

  /* ===== Screens ===== */
  .screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
  .screen.hidden { display: none; }
  .h { font-size: 1.15rem; font-weight: 900; color: var(--gold); margin-bottom: 4px; }
  .sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }

  /* ===== Body map ===== */
  .map-wrap {
    position: relative; width: 100%; aspect-ratio: 3/4; max-height: 58vh;
    margin: 0 auto 18px; border: 1px solid var(--border); border-radius: 18px;
    background:
      radial-gradient(80% 50% at 50% 8%, rgba(74,158,255,0.10), transparent 60%),
      linear-gradient(180deg, #10203a, #0b1424);
    overflow: hidden;
  }
  .body-svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
  .pin {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; text-align: center;
  }
  .pin .dot {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    font-size: 1.5rem; border: 2px solid var(--gold);
    background: radial-gradient(circle at 50% 35%, #24466f, #0e1d33);
    box-shadow: 0 0 0 0 rgba(255,200,50,0.5); transition: transform .12s;
  }
  .pin:active .dot { transform: scale(0.9); }
  .pin.new .dot { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,200,50,.5)} 70%{box-shadow:0 0 0 12px rgba(255,200,50,0)} 100%{box-shadow:0 0 0 0 rgba(255,200,50,0)} }
  .pin.cleared .dot { border-color: var(--correct); }
  .pin.locked .dot { border-color: rgba(255,255,255,.2); opacity: .5; }
  .pin .lbl {
    font-size: .62rem; font-weight: 800; background: rgba(6,14,26,.85);
    padding: 2px 7px; border-radius: 999px; white-space: nowrap; color: var(--text);
  }
  .pin.locked .lbl { color: var(--muted); }

  /* ===== Story / dialog ===== */
  .patient-tag {
    display: inline-flex; align-items:center; gap:6px; font-size: 0.75rem; color: var(--gold);
    background: rgba(255,200,50,0.1); padding: 5px 12px; border-radius: 999px;
    margin-bottom: 14px; font-weight: 700;
  }
  .case-info {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 16px; font-size: .82rem; line-height: 1.8;
  }
  .case-info b { color: var(--muted); }
  .dialog { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; min-height: 40px; }
  .line { display: flex; gap: 10px; align-items: flex-start; animation: fade .3s; }
  .line .av { font-size: 1.6rem; flex: 0 0 auto; width: 34px; text-align: center; }
  .line .bubble {
    background: var(--card2); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px;
    padding: 10px 14px; font-size: .9rem; line-height: 1.65; flex: 1;
  }
  .line.narrator .bubble { background: transparent; border: none; color: var(--muted); font-style: italic; padding: 6px 4px; }
  .line.monster .bubble { border-color: var(--wrong); background: rgba(255,90,106,0.10); color: #ffd0d5; }
  .line.detective .bubble { border-color: var(--gold); background: rgba(255,200,50,0.08); }
  .line .who { display:block; font-size:.66rem; font-weight:800; color:var(--muted); margin-bottom:3px; }

  /* ===== Battle ===== */
  .battle-stage {
    background: radial-gradient(120% 80% at 50% 20%, #1a2f52 0%, #0c1a30 70%);
    border: 1px solid var(--border); border-radius: 18px; padding: 20px 18px;
    text-align: center; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .mon-name { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
  .mon-intro { font-size:.72rem; color: var(--wrong); margin-top:2px; }
  .mon-big { font-size: 4.4rem; line-height: 1.1; margin: 6px 0; display: inline-block; transition: transform .15s; }
  .mon-big.hit { animation: shake .4s; }
  .mon-big.faint { animation: faint .8s forwards; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px) rotate(-6deg)} 40%{transform:translateX(10px) rotate(6deg)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
  @keyframes faint { to { transform: translateY(30px) scale(.4) rotate(20deg); opacity: 0; } }
  .hpwrap { max-width: 240px; margin: 8px auto 0; }
  .hp-label { font-size: 0.7rem; color: var(--muted); display:flex; justify-content:space-between; margin-bottom:3px; }
  .hpbar { height: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; overflow: hidden; border:1px solid rgba(255,255,255,.1); }
  .hpbar > i { display:block; height:100%; background: linear-gradient(90deg, var(--wrong), #ff8a5a); transition: width .5s; }
  .float-dmg {
    position: absolute; top: 40%; left: 50%; transform: translateX(-50%);
    font-size: 1.6rem; font-weight: 900; color: var(--gold); pointer-events: none; opacity: 0;
  }
  .float-dmg.go { animation: floatUp 1s forwards; }
  @keyframes floatUp { 0%{opacity:1; transform: translate(-50%,0)} 100%{opacity:0; transform: translate(-50%,-60px)} }

  .q-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .q-count { font-size: 0.72rem; color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .q-text { font-size: 1rem; font-weight: 700; line-height: 1.6; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: var(--card2); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 15px 16px; font-size: 0.95rem; text-align: left; color: var(--text);
    cursor: pointer; transition: transform .1s, border-color .15s, background .15s;
    font-family: inherit; line-height: 1.5;
  }
  .choice:active { transform: scale(0.98); }
  .choice.correct { border-color: var(--correct); background: rgba(74,255,127,0.14); }
  .choice.wrong { border-color: var(--wrong); background: rgba(255,90,106,0.14); }
  .choice:disabled { cursor: default; }
  .explain {
    margin-top: 14px; font-size: 0.85rem; line-height: 1.7;
    background: rgba(74,158,255,0.08); border-left: 3px solid var(--accent);
    padding: 12px 14px; border-radius: 8px; display: none;
  }
  .explain.show { display: block; }
  .explain b { color: var(--gold); }

  /* ===== Dex ===== */
  .dex-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .dex-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .dex-card.empty { opacity: .5; text-align:center; padding: 22px; font-size:.85rem; color:var(--muted); }
  .dex-card h3 { font-size: 1rem; color: var(--gold); margin-bottom: 2px; }
  .dex-card h3 small { font-weight: 400; color: var(--muted); font-size: .72rem; margin-left: 6px; }
  .dex-card .tag { font-size: .68rem; font-weight: 800; letter-spacing:.05em; text-transform:uppercase; }
  .dex-card .tag.m { color: var(--wrong); }
  .dex-card .tag.p { color: var(--accent); }
  .dex-row { font-size: .82rem; line-height: 1.7; margin-top: 8px; }
  .dex-row b { color: var(--muted); font-weight:700; }
  .meridian-pill { display:inline-block; font-size:.68rem; font-weight:800; color:var(--accent);
    background:rgba(74,158,255,.12); padding:2px 8px; border-radius:999px; margin-left:6px; }

  /* ===== Buttons ===== */
  .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1rem;
    font-weight: 900; cursor: pointer; font-family: inherit; transition: opacity .2s, transform .1s; }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.gold { background: var(--gold); color: #000; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn + .btn { margin-top: 10px; }
  .hidden { display: none !important; }

  /* ===== Bottom nav ===== */
  .nav { flex: 0 0 auto; display: flex; border-top: 1px solid var(--border); background: var(--card); padding-bottom: var(--safe-b); }
  .nav button { flex: 1; background: none; border: none; color: var(--muted); padding: 10px 4px;
    font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 0.66rem; font-weight: 700; }
  .nav button .ic { font-size: 1.3rem; }
  .nav button.active { color: var(--accent); }

  /* ===== Training ===== */
  .stat-card { background: var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .stat-row:last-child { border-bottom:none; }
  .stat-name { font-size:.9rem; font-weight:700; }
  .stat-name small { display:block; color:var(--muted); font-weight:400; font-size:.72rem; }
  .stat-val { font-size:1rem; font-weight:900; color:var(--gold); min-width:36px; text-align:center; }
  .stat-up { width:34px; height:34px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:1.2rem; font-weight:900; cursor:pointer; }
  .stat-up:disabled { opacity:.3; }

  /* ===== Result overlay ===== */
  .overlay { position: absolute; inset: 0; background: rgba(6,14,26,0.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
    z-index: 50; backdrop-filter: blur(4px); }
  .overlay.show { display: flex; animation: fade .3s; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .overlay .big-emoji { font-size: 4rem; margin-bottom: 12px; }
  .overlay h2 { font-size: 1.5rem; color: var(--gold); margin-bottom: 8px; }
  .overlay p { font-size: 0.92rem; color: var(--text); line-height: 1.8; margin-bottom: 8px; white-space: pre-wrap; }
  .reward { font-size: 1.05rem; font-weight: 900; color: var(--correct); margin: 10px 0 20px; white-space: pre-wrap; }
  .overlay .btn { max-width: 280px; }

  .hint-small { font-size:.72rem; color:var(--muted); margin-top:14px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="badge">⚔️</div>
    <div class="who">
      <div class="name">ツボ刑事</div>
      <div class="lvl" id="lvl-text">Lv.1</div>
      <div class="xpbar"><i id="xp-fill"></i></div>
    </div>
    <div class="coin" id="coin">🪙 0</div>
  </div>

  <!-- ===== MAP ===== -->
  <div class="screen" id="screen-map">
    <div class="h">🗺 事件マップ</div>
    <div class="sub">身体の各所で「症状の事件」が発生中。光るピンをタップして捜査を開始せよ。原因筋とツボを見抜き、症状モンスターを鎮めろ。</div>
    <div class="map-wrap" id="map-wrap">
      <svg class="body-svg" viewBox="0 0 100 133" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <g fill="none" stroke="#4a9eff" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="50" cy="15" r="8"/>
          <path d="M43 22 Q50 27 57 22 L64 34 L58 40 L58 70 Q50 74 42 70 L42 40 L36 34 Z"/>
          <path d="M42 40 L30 44 L26 62"/>
          <path d="M58 40 L70 44 L74 62"/>
          <path d="M46 70 L42 108 L44 120"/>
          <path d="M54 70 L58 108 L56 120"/>
        </g>
      </svg>
      <!-- pins injected -->
    </div>
    <div class="hint-small">解決するたびに図鑑へツボ・筋肉が登録され、経験値でレベルが上がります。</div>
  </div>

  <!-- ===== STORY ===== -->
  <div class="screen hidden" id="screen-story">
    <div class="h" id="story-title"></div>
    <span class="patient-tag" id="story-patient"></span>
    <div class="case-info" id="story-caseinfo"></div>
    <div class="dialog" id="story-dialog"></div>
    <button class="btn ghost" id="btn-advance">▼ つづき</button>
    <button class="btn primary hidden" id="btn-start-battle">🔍 捜査開始(バトル)</button>
    <button class="btn ghost" onclick="go('map')">← マップに戻る</button>
  </div>

  <!-- ===== BATTLE ===== -->
  <div class="screen hidden" id="screen-battle">
    <div class="battle-stage">
      <div class="mon-name" id="b-monname"></div>
      <div class="mon-intro" id="b-monintro"></div>
      <div class="mon-big" id="b-monemoji">😵</div>
      <div class="float-dmg" id="b-dmg"></div>
      <div class="hpwrap">
        <div class="hp-label"><span id="b-hplabel">症状の抵抗</span><span id="b-hpnum"></span></div>
        <div class="hpbar"><i id="b-hpfill"></i></div>
      </div>
    </div>
    <div class="q-box">
      <div class="q-count" id="b-qcount"></div>
      <div class="q-text" id="b-qtext"></div>
    </div>
    <div class="choices" id="b-choices"></div>
    <div class="explain" id="b-explain"></div>
    <button class="btn primary hidden" id="b-next" style="margin-top:14px;">次へ ▶</button>
  </div>

  <!-- ===== DEX ===== -->
  <div class="screen hidden" id="screen-dex">
    <div class="h">📖 経穴・解剖 図鑑</div>
    <div class="sub">事件を解決するたびに、原因筋と経穴(ツボ)の知識が登録される。<span id="dex-count"></span></div>
    <div class="dex-grid" id="dex-grid"></div>
  </div>

  <!-- ===== TRAINING ===== -->
  <div class="screen hidden" id="screen-train">
    <div class="h">💪 育成・トレーニング</div>
    <div class="sub">レベルアップで手に入る「捜査ポイント」を割り振って、ツボ刑事を強化しよう。</div>
    <div class="stat-card">
      <div style="font-size:.8rem; color:var(--accent); font-weight:800; margin-bottom:6px;">未割り振りポイント</div>
      <div style="font-size:2rem; font-weight:900; color:var(--gold);" id="t-points">0</div>
    </div>
    <div class="stat-card" id="t-stats"></div>
    <div class="hint-small">「診断眼」が高いほど1問の与ダメージが増え、事件を早く解決できる。</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="big-emoji" id="ov-emoji">🎉</div>
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <div class="reward" id="ov-reward"></div>
    <button class="btn gold" id="ov-btn"></button>
  </div>

  <div class="nav" id="nav">
    <button data-scr="map" class="active"><span class="ic">🗺</span>マップ</button>
    <button data-scr="dex"><span class="ic">📖</span>図鑑</button>
    <button data-scr="train"><span class="ic">💪</span>育成</button>
  </div>

</div>

<script src="js/data.js"></script>
<script>
/* ============================================================
 *  ツボ刑事 — ゲームロジック(window.EPISODES を消費)
 * ============================================================ */
const EPISODES = (window.EPISODES || []).slice().sort((a, b) => a.ep - b.ep);
const SAVE_KEY = "tuboKeijiSave_v2";
const XP_PER_LEVEL = 100;
const AVATAR = { narrator: "🎬", patient: "🧍", detective: "🕵️", monster: "👾" };
const WHO = { narrator: "", patient: "患者", detective: "ツボ刑事", monster: "症状モンスター" };

const defaultState = () => ({
  level: 1, xp: 0, coins: 0, points: 0,
  stats: { diagnosis: 1, focus: 1 },
  cleared: {}, dex: {},
});

let S = load();
let current = null;   // 現在のエピソード
let battle = null;    // バトル状態
let dialogIdx = 0;    // ストーリー進行位置

function epId(ep) { return "ep" + ep.ep; }
function monHp(ep) { return ep.quiz.length; }  // HP = クイズ数(全問で確実に撃破)

function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}
  return defaultState();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 画面遷移 ---------- */
function go(scr) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.add("hidden"));
  document.getElementById("screen-" + scr).classList.remove("hidden");
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.scr === scr));
  if (scr === "map") renderMap();
  if (scr === "dex") renderDex();
  if (scr === "train") renderTrain();
  document.getElementById("screen-" + scr).scrollTop = 0;
}
document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => go(b.dataset.scr)));

/* ---------- ヘッダー ---------- */
function renderHeader() {
  document.getElementById("lvl-text").textContent = "Lv." + S.level + "　" + S.xp + " / " + XP_PER_LEVEL + " XP";
  document.getElementById("xp-fill").style.width = (S.xp / XP_PER_LEVEL * 100) + "%";
  document.getElementById("coin").textContent = "🪙 " + S.coins;
}

/* ---------- マップ ---------- */
function isUnlocked(idx) { return idx === 0 ? true : !!S.cleared[epId(EPISODES[idx - 1])]; }
function renderMap() {
  const wrap = document.getElementById("map-wrap");
  wrap.querySelectorAll(".pin").forEach((p) => p.remove());
  EPISODES.forEach((ep, i) => {
    const cleared = !!S.cleared[epId(ep)];
    const unlocked = isUnlocked(i);
    const pos = ep.mapPos || { x: 50, y: 20 + i * 15 };
    const pin = document.createElement("div");
    pin.className = "pin " + (cleared ? "cleared" : unlocked ? "new" : "locked");
    pin.style.left = pos.x + "%";
    pin.style.top = pos.y + "%";
    pin.innerHTML =
      '<div class="dot">' + (unlocked ? (cleared ? "✅" : ep.monster.emoji) : "🔒") + '</div>' +
      '<div class="lbl">' + (unlocked ? ep.location : "？？？") + '</div>';
    if (unlocked) pin.addEventListener("click", () => openStory(ep));
    wrap.appendChild(pin);
  });
}

/* ---------- ストーリー(会話送り) ---------- */
function openStory(ep) {
  current = ep;
  dialogIdx = 0;
  const p = ep.patient;
  document.getElementById("story-title").textContent = "EP" + ep.ep + " " + ep.title;
  document.getElementById("story-patient").textContent = p.emoji + " " + p.name + "・" + p.age + "歳・" + p.gender + "・" + p.job;
  document.getElementById("story-caseinfo").innerHTML =
    "<b>主訴:</b> " + ep.symptom + "<br>" +
    "<b>きっかけ:</b> " + ep.trigger + "<br>" +
    "<b>諦めたこと:</b> " + ep.gaveup;
  document.getElementById("story-dialog").innerHTML = "";
  document.getElementById("btn-advance").classList.remove("hidden");
  document.getElementById("btn-start-battle").classList.add("hidden");
  document.getElementById("btn-start-battle").textContent =
    S.cleared[epId(ep)] ? "🔁 もう一度挑戦(復習)" : "🔍 捜査開始(バトル)";
  go("story");
  advanceDialog();
}
function advanceDialog() {
  const ep = current;
  if (dialogIdx >= ep.script.length) {
    document.getElementById("btn-advance").classList.add("hidden");
    document.getElementById("btn-start-battle").classList.remove("hidden");
    return;
  }
  const l = ep.script[dialogIdx++];
  const div = document.createElement("div");
  div.className = "line " + l.speaker;
  const who = WHO[l.speaker] ? '<span class="who">' + WHO[l.speaker] + '</span>' : "";
  div.innerHTML =
    (l.speaker === "narrator" ? "" : '<div class="av">' + (AVATAR[l.speaker] || "💬") + '</div>') +
    '<div class="bubble">' + who + l.text + '</div>';
  document.getElementById("story-dialog").appendChild(div);
  const scr = document.getElementById("screen-story");
  scr.scrollTop = scr.scrollHeight;
  if (dialogIdx >= ep.script.length) {
    document.getElementById("btn-advance").classList.add("hidden");
    document.getElementById("btn-start-battle").classList.remove("hidden");
  }
}
document.getElementById("btn-advance").addEventListener("click", advanceDialog);
document.getElementById("btn-start-battle").addEventListener("click", () => startBattle(current));

/* ---------- バトル ---------- */
function startBattle(ep) {
  const hp = monHp(ep);
  battle = { ep, queue: shuffle(ep.quiz.slice()), idx: 0, maxHp: hp, hp: hp, correctCount: 0, answered: false };
  document.getElementById("b-monname").textContent = "▼ " + ep.monster.name + " が あらわれた!";
  document.getElementById("b-monintro").textContent = ep.monster.intro || "";
  const me = document.getElementById("b-monemoji");
  me.textContent = ep.monster.emoji; me.className = "mon-big";
  updateHp();
  go("battle");
  showQuestion();
}
function updateHp() {
  document.getElementById("b-hpnum").textContent = battle.hp + " / " + battle.maxHp;
  document.getElementById("b-hpfill").style.width = (battle.hp / battle.maxHp * 100) + "%";
}
function showQuestion() {
  const q = battle.queue[battle.idx];
  battle.answered = false;
  document.getElementById("b-qcount").textContent = "第 " + (battle.idx + 1) + " / " + battle.queue.length + " 問";
  document.getElementById("b-qtext").textContent = q.q;
  const cc = document.getElementById("b-choices");
  cc.innerHTML = "";
  q.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice"; btn.textContent = c;
    btn.addEventListener("click", () => answer(i, btn));
    cc.appendChild(btn);
  });
  document.getElementById("b-explain").className = "explain";
  document.getElementById("b-explain").innerHTML = "";
  document.getElementById("b-next").classList.add("hidden");
}
function answer(i, btn) {
  if (battle.answered) return;
  battle.answered = true;
  const q = battle.queue[battle.idx];
  const buttons = document.querySelectorAll("#b-choices .choice");
  buttons.forEach((b) => (b.disabled = true));
  const correct = i === q.answer;
  buttons[q.answer].classList.add("correct");
  if (!correct) btn.classList.add("wrong");

  const ep = battle.ep;
  const exp = document.getElementById("b-explain");
  if (correct) {
    battle.correctCount++;
    const dmg = 1 + Math.floor((S.stats.diagnosis - 1) / 2);
    dealDamage(dmg);
    exp.innerHTML = "⭕ <b>正解!</b> " + q.explain +
      '<br><span style="color:var(--gold)">『' + ep.acupoint.name + '』の一撃! ' + dmg + ' ダメージ</span>';
  } else {
    exp.innerHTML = "❌ <b>不正解…</b> " + q.explain;
  }
  exp.className = "explain show";
  const nextBtn = document.getElementById("b-next");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = (battle.hp <= 0 || battle.idx + 1 >= battle.queue.length) ? "結果へ ▶" : "次へ ▶";
  nextBtn.onclick = () => {
    if (battle.hp <= 0) { winBattle(); return; }
    battle.idx++;
    if (battle.idx >= battle.queue.length) finishByScore();
    else showQuestion();
  };
  renderHeader();
}
function dealDamage(dmg) {
  battle.hp = Math.max(0, battle.hp - dmg);
  updateHp();
  const me = document.getElementById("b-monemoji");
  me.classList.remove("hit"); void me.offsetWidth; me.classList.add("hit");
  const f = document.getElementById("b-dmg");
  f.textContent = "-" + dmg;
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  if (battle.hp <= 0) me.className = "mon-big faint";
}
function finishByScore() {
  // 全問終了時: 過半数正解で勝ち(HPが残っていても知識合格とみなす)
  if (battle.correctCount >= Math.ceil(battle.queue.length / 2)) winBattle();
  else loseBattle();
}
function winBattle() {
  const ep = battle.ep;
  const firstClear = !S.cleared[epId(ep)];
  S.cleared[epId(ep)] = true;
  S.dex[epId(ep)] = { muscle: ep.muscle, acupoint: ep.acupoint };
  let xpGain = firstClear ? 60 : 20, coinGain = firstClear ? 30 : 8;
  const perfect = battle.correctCount === battle.queue.length;
  if (perfect) { xpGain += 20; coinGain += 10; }
  S.coins += coinGain;
  const leveled = addXp(xpGain);
  save(); renderHeader();
  showOverlay({
    emoji: "🎊", title: "事件解決!",
    text: ep.monster.name + " を鎮めた!\n弱点は原因筋『" + ep.muscle.name + "』と経穴『" + ep.acupoint.name + "』。" +
          (perfect ? "\n✨ 全問正解パーフェクト!" : ""),
    reward: "+" + xpGain + " XP　🪙+" + coinGain +
            (leveled ? "\n🎉 レベルアップ! Lv." + S.level + "(捜査ポイント+" + leveled + ")" : ""),
    btnText: "図鑑に登録して戻る",
    onClose: () => { hideOverlay(); go("map"); },
  });
}
function loseBattle() {
  showOverlay({
    emoji: "😓", title: "捜査失敗…",
    text: "症状モンスターを鎮めきれなかった。\n解説をよく読んで、もう一度挑戦しよう。",
    reward: "", btnText: "もう一度挑戦",
    onClose: () => { hideOverlay(); startBattle(battle.ep); },
  });
}
function addXp(amount) {
  S.xp += amount; let g = 0;
  while (S.xp >= XP_PER_LEVEL) { S.xp -= XP_PER_LEVEL; S.level++; S.points++; g++; }
  return g;
}

/* ---------- オーバーレイ ---------- */
function showOverlay({ emoji, title, text, reward, btnText, onClose }) {
  document.getElementById("ov-emoji").textContent = emoji;
  document.getElementById("ov-title").textContent = title;
  document.getElementById("ov-text").textContent = text;
  document.getElementById("ov-reward").textContent = reward;
  const b = document.getElementById("ov-btn");
  b.textContent = btnText; b.onclick = onClose;
  document.getElementById("overlay").classList.add("show");
}
function hideOverlay() { document.getElementById("overlay").classList.remove("show"); }

/* ---------- 図鑑 ---------- */
function renderDex() {
  const grid = document.getElementById("dex-grid");
  const total = EPISODES.length, got = Object.keys(S.dex).length;
  document.getElementById("dex-count").textContent = " (" + got + " / " + total + " 登録済み)";
  grid.innerHTML = "";
  if (got === 0) {
    grid.innerHTML = '<div class="dex-card empty">まだ登録がありません。<br>マップで事件を解決すると、ここにツボと筋肉が集まります。</div>';
    return;
  }
  EPISODES.forEach((ep) => {
    const d = S.dex[epId(ep)];
    if (!d) return;
    const m = d.muscle, p = d.acupoint;
    const card = document.createElement("div");
    card.className = "dex-card";
    card.innerHTML =
      '<span class="tag m">💀 原因筋</span>' +
      '<h3>' + m.name + (m.reading ? '<small>' + m.reading + '</small>' : '') + '</h3>' +
      '<div class="dex-row">' + m.info + '</div>' +
      '<hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:14px 0;">' +
      '<span class="tag p">🎯 経穴(ツボ)</span>' +
      '<h3>' + p.name + (p.reading ? '<small>' + p.reading + '</small>' : '') +
        (p.meridian ? '<span class="meridian-pill">' + p.meridian + '</span>' : '') + '</h3>' +
      '<div class="dex-row"><b>位置:</b> ' + p.location + '</div>' +
      (p.how ? '<div class="dex-row"><b>圧し方:</b> ' + p.how + '</div>' : '') +
      '<div class="dex-row"><b>効果:</b> ' + p.effect + '</div>' +
      (p.caution ? '<div class="dex-row" style="color:var(--wrong)"><b style="color:var(--wrong)">注意:</b> ' + p.caution + '</div>' : '');
    grid.appendChild(card);
  });
}

/* ---------- 育成 ---------- */
const STAT_DEFS = [
  { key: "diagnosis", name: "診断眼", desc: "2上げるごとに与ダメージ+1(事件を早く解決)" },
  { key: "focus", name: "集中力", desc: "精神力を高め、粘り強く捜査できる" },
];
function renderTrain() {
  document.getElementById("t-points").textContent = S.points;
  const box = document.getElementById("t-stats");
  box.innerHTML = "";
  STAT_DEFS.forEach((def) => {
    const row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML =
      '<div class="stat-name">' + def.name + '<small>' + def.desc + '</small></div>' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
        '<span class="stat-val">' + S.stats[def.key] + '</span>' +
        '<button class="stat-up" ' + (S.points <= 0 ? "disabled" : "") + '>+</button></div>';
    row.querySelector(".stat-up").addEventListener("click", () => {
      if (S.points <= 0) return;
      S.points--; S.stats[def.key]++; save(); renderTrain(); renderHeader();
    });
    box.appendChild(row);
  });
}

/* ---------- util ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- init ---------- */
if (EPISODES.length === 0) {
  document.getElementById("screen-map").innerHTML =
    '<div class="h">データがありません</div><div class="sub">js/data.js の EPISODES にエピソードを追加してください。</div>';
} else {
  renderHeader();
  go("map");
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
